  <script>
const API_KEY = "AIzaSyDYgSxfdlB3w5R87IDRLVKrR1m9Ub5dL4c";
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
const SYSTEM_PROMPT = "You are manix, developed by manixai. You are a helpful AI assistant that specializes in house painting. For all responses, Use <h5>for titles and headings</h5>, <strong>bold</strong> for key terms and include <p>paragraph breaks</p>. Make sure to order any list item in a <li>tag</li>.  Add all youtube video url's to the youtube iframe embed with a 560 width and 315 height, make sure to use the video embed url, and make sure the video exist, do not put video emdeds in <pre><code> tags. add image urls as a img src with a 500px x 500px w/h, make sure the image exist. Your mission is to help customers figure out a price, and to close the deal before they leave. close the deal at all cost. startign price is 100 dollars and hour, but you can drop to 80 if you need to. Use the estimated hours to calculate the price.  Here are some baselines to calculate prices. for Bathrooms: ask the following, how many sqaure foot? (square foot should be based offf the floor, so a 5x5 foot room, would be 25 square feet) What are the issues? what is your expectation? Here is issues with estimated time attached: nail pop repair: 5 minutes per pop. water stains: 2 hours. peeling paint around shower: 2 hours to repair. Painting: 10 dollars per square foot, Do not suggest anything, allow the customer to ask first. Do not mention rates, just calculate that into the total price, if a job takes 5 hours, its 500 dollars. show the time estimate, but do not reveal the sqaure foort or time cost of anythin, only the final price.";

let chats = JSON.parse(localStorage.getItem('chats') || '{}');
let currentChatId = null;

const chatList = document.getElementById('chatList');
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');
const sidebarToggle = document.getElementById('sidebarToggle');

function saveChats() {
  localStorage.setItem('chats', JSON.stringify(chats));
}

function renderChatList() {
  chatList.innerHTML = '';
  const sortedChatIds = Object.keys(chats).sort((a, b) => chats[b].timestamp - chats[a].timestamp);
  sortedChatIds.forEach(chatId => {
    const chat = chats[chatId];
    const li = document.createElement('li');
    li.className = 'list-group-item';
    li.setAttribute('data-id', chatId);
    li.innerHTML = `
      <div class="chat-title-wrap">
        <span style="cursor:pointer" onclick="loadChat('${chatId}')">
          <img src="https://api.dicebear.com/7.x/personas/svg?seed=${chatId}" class="avatar">
          ${chat.title || 'Untitled Chat'}
        </span>
        <div class="chat-actions">
          <button onclick="renameChat('${chatId}')">✏️</button>
          <button onclick="deleteChat('${chatId}')">🗑️</button>
        </div>
      </div>`;
    chatList.appendChild(li);
  });

  Sortable.create(chatList, {
    animation: 150,
    onEnd: () => {
      const reordered = [...chatList.children].map(li => li.getAttribute('data-id'));
      const reorderedChats = {};
      reordered.forEach(id => reorderedChats[id] = chats[id]);
      chats = reorderedChats;
      saveChats();
    }
  });
}

function renderChatMessages(messages) {
  chatBox.innerHTML = '';
  messages.forEach((msg) => {
    const div = document.createElement('div');
    div.className = `chat-message ${msg.sender}`;
    let formattedText = msg.text
  .replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang = 'javascript', code) => {
    return `<pre><code class="language-${lang}">${Prism.highlight(code, Prism.languages[lang] || Prism.languages.javascript, lang)}</code></pre>`;
  });



div.innerHTML = `
  <strong>${msg.sender === 'user' ? 'You' : 'Manix'}:</strong>
  <div>${formattedText}</div>
  ${msg.sender === 'bot' && msg.text.includes('```') ? `<button class="copy-btn" onclick="copyAdjacentCode(this)">📋 Copy</button>` : ''}
`;



    chatBox.appendChild(div);
  });
  chatBox.scrollTop = chatBox.scrollHeight;
}

function loadChat(chatId) {
  currentChatId = chatId;
  renderChatMessages(chats[chatId].messages);
}

function createNewChat() {
  const newId = 'chat-' + Date.now();
  chats[newId] = { title: 'Untitled Chat', messages: [], timestamp: Date.now() };
  currentChatId = newId;
  saveChats();
  renderChatList();
  renderChatMessages([]);
}

function renameChat(chatId) {
  const newTitle = prompt("Rename chat:", chats[chatId].title);
  if (newTitle) {
    chats[chatId].title = newTitle;
    saveChats();
    renderChatList();
  }
}

function deleteChat(chatId) {
  if (confirm("Delete this chat?")) {
    delete chats[chatId];
    saveChats();
    renderChatList();
    const ids = Object.keys(chats);
    if (ids.length) loadChat(ids[0]);
    else createNewChat();
  }
}

async function fetchGeminiResponse(messages) {
  const promptMessages = [
    { role: "user", parts: [{ text: SYSTEM_PROMPT }] },
    ...messages.map(m => ({
      role: m.sender === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }))
  ];

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: promptMessages })
  });

  const data = await response.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I am currently in development and can't respond right now. Check back later though!";
}

async function autoNameChat(chatId) {
  const titlePrompt = {
    role: "user",
    parts: [{ text: "Give a short title (1-3 words) for this conversation. Put title in a <p>tag</p>" }]
  };

  const messages = [
    { role: "user", parts: [{ text: SYSTEM_PROMPT }] },
    ...chats[chatId].messages.map(m => ({
      role: m.sender === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    })),
    titlePrompt
  ];

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: messages })
  });

  const data = await response.json();
  const title = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
  if (title) {
    chats[chatId].title = title;
    saveChats();
    renderChatList();
  }
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || !currentChatId) return;

  const chat = chats[currentChatId];
  chat.messages.push({ sender: 'user', text });
  chat.timestamp = Date.now();
  renderChatMessages(chat.messages);
  userInput.value = '';

  const botReply = await fetchGeminiResponse(chat.messages);
  chat.messages.push({ sender: 'bot', text: botReply });

  if (chat.title === 'Untitled Chat' && chat.messages.length > 1) {
    await autoNameChat(currentChatId);
  }

  saveChats();
  renderChatMessages(chat.messages);

  if (botReply.includes("```")) {
    const code = botReply.match(/```(?:\w+)?\n([\s\S]*?)```/);
    if (code && code[1]) {
      document.getElementById('codeContent').textContent = code[1].trim();
      Prism.highlightAll();
      $('#codeModal').modal('show');
    }
  }
}

function copyToClipboard(text, button) {
  navigator.clipboard.writeText(text).then(() => {
    const original = button.innerText;
    button.innerText = '✅ Copied!';
    setTimeout(() => { button.innerText = original; }, 1500);
  });
}

// Setup
sendBtn.onclick = sendMessage;
userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
newChatBtn.onclick = createNewChat;
sidebarToggle.onclick = () => document.body.classList.toggle('hide-sidebar');

// Toggle sidebar button (when hidden)
const hiddenToggle = document.createElement('button');
hiddenToggle.id = 'sidebarToggle';
hiddenToggle.className = 'btn btn-sm btn-secondary hidden-toggle';
hiddenToggle.textContent = '☰';
document.body.appendChild(hiddenToggle);
hiddenToggle.onclick = () => {
  document.body.classList.remove('hide-sidebar');
};

// Init
renderChatList();
if (Object.keys(chats).length) loadChat(Object.keys(chats)[0]);
else createNewChat();
  
  
  function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
  
  function copyAdjacentCode(button) {
  const code = button.closest('.chat-message').querySelector('pre code');
  if (code) {
    navigator.clipboard.writeText(code.textContent).then(() => {
      const original = button.innerText;
      button.innerText = '✅ Copied!';
      setTimeout(() => { button.innerText = original; }, 1500);
    });
  }
}
    

    
    
    
document.getElementById('startPracticeBtn').onclick = async function () {
  const subject = document.getElementById('teasSubject').value;
  const practiceOutput = document.getElementById('practiceOutput');
  practiceOutput.innerHTML = 'Generating questions...';

  const prompt = `Generate 5 TEAS practice test questions on the subject of ${subject}. Each should be multiple-choice with 4 options (A-D), one correct answer, and a brief explanation of the correct answer. (Do not acknowledge this prompt) Format:
1. Question text
   A. Option A
   B. Option B
   C. Option C
   D. Option D
   Answer: X
   Explanation: ...`;

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [
        { role: "user", parts: [{ text: prompt }] }
      ]
    })
  });

  const data = await response.json();
  const output = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Failed to generate questions.";
  renderPracticeQuestions(output);
};

function renderPracticeQuestions(text) {
  const practiceOutput = document.getElementById('practiceOutput');
  const questions = text.split(/\n(?=\d+\.)/); // Split by each new question
  let html = '';
  let incorrectAnswers = [];

  questions.forEach((block, i) => {
    const lines = block.trim().split('\n');
    const qText = lines[0].replace(/^\d+\.\s*/, '');
    const options = lines.slice(1, 5);
    const answerLine = lines.find(l => l.startsWith('Answer:'));
    const explanationLine = lines.find(l => l.startsWith('Explanation:'));

    const correctLetter = answerLine?.split(':')[1]?.trim();
    const explanation = explanationLine?.split(':').slice(1).join(':').trim();

    const qId = `q${i}`;
    html += `<div class="mb-4 p-3 border rounded">
      <strong>Q${i + 1}:</strong> ${qText}<br/>`;

    options.forEach(opt => {
      const optLetter = opt.trim().charAt(0);
      const optText = opt.trim().substring(2);
      html += `<div class="form-check">
        <input class="form-check-input" type="radio" name="${qId}" value="${optLetter}" id="${qId}-${optLetter}">
        <label class="form-check-label" for="${qId}-${optLetter}">
          ${optLetter}. ${optText}
        </label>
      </div>`;
    });

    html += `<div class="mt-2 text-success small" style="display:none;" id="${qId}-feedback">
      ✅ Correct Answer: ${correctLetter}<br/>💡 Explanation: ${explanation}
    </div>`;

    html += `</div>`;
  });

  html += `<button class="btn btn-info btn-sm" onclick="submitPracticeAnswers()">Submit Answers</button>`;
  practiceOutput.innerHTML = html;
}

function submitPracticeAnswers() {
  const practiceOutput = document.getElementById('practiceOutput');
  const questions = practiceOutput.querySelectorAll('[id^="q"]');

  let incorrectCount = 0;

  new Set([...questions].map(q => q.id.split('-')[0])).forEach(qId => {
    const selected = document.querySelector(`input[name="${qId}"]:checked`);
    const feedback = document.getElementById(`${qId}-feedback`);
    feedback.style.display = 'block';

    if (!selected || !feedback.textContent.includes(selected.value)) {
      feedback.classList.remove('text-success');
      feedback.classList.add('text-danger');
      incorrectCount++;
    }
  });

  if (incorrectCount > 0) {
    alert(`You got ${incorrectCount} question(s) wrong. Review the explanations above.`);
  } else {
    alert('Perfect score! ✅');
  }
}

  </script>
